<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nativo Café - Panel de Inventario</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Libre+Caslon+Text:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      "primary": "#26170c",
                      "on-primary": "#ffffff",
                      "primary-container": "#3d2b1f",
                      "surface": "#fff8f5",
                      "on-surface": "#241910",
                      "on-surface-variant": "#4f453f",
                      "outline": "#81756e",
                      "surface-container-highest": "#f4dfcf",
                      "error": "#ba1a1a"
                  },
                  fontFamily: {
                      "serif": ["Libre Caslon Text", "serif"],
                      "sans": ["Hanken Grotesk", "sans-serif"],
                  }
              }
          }
      }
  </script>
  <style>
      body { background-color: #fff8f5; color: #241910; }
      .glass-panel { background: rgba(255, 248, 245, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(129, 117, 110, 0.2); }
      .table-row-hover:hover { background-color: rgba(61, 43, 31, 0.05); }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased">

  <header class="bg-surface border-b border-outline/20 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <h1 class="font-serif text-2xl font-bold text-primary">Nativo Café <span class="text-on-surface-variant font-sans text-lg font-normal ml-2">| Control de Inventario</span></h1>
      <button onclick="listarInventario()" class="flex items-center gap-2 text-primary hover:text-on-surface-variant transition-colors">
        <span class="material-symbols-outlined">refresh</span> Actualizar Datos
      </button>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12 grid grid-cols-1 lg:grid-cols-3 gap-10">
    
    <section class="lg:col-span-1">
      <div class="glass-panel p-8 rounded-xl shadow-sm">
        <div class="flex items-center gap-3 mb-6 border-b border-outline/10 pb-4">
          <span class="material-symbols-outlined text-primary text-3xl" id="form-icon">add_circle</span>
          <h2 id="form-titulo" class="font-serif text-xl text-primary font-bold">Registrar Café</h2>
        </div>
        
        <form id="form-inventario" class="space-y-4">
          <input type="hidden" id="cafe-id" value="" />
          
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Nombre de Origen</label>
            <input type="text" id="nombre" class="w-full rounded border-outline/30 focus:border-primary focus:ring-primary bg-white" placeholder="Ej. Etiopía Yirgacheffe" required />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Variedad</label>
            <input type="text" id="variedad" class="w-full rounded border-outline/30 focus:border-primary focus:ring-primary bg-white" placeholder="Ej. Bourbon, Typica..." required />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Perfil de Tueste</label>
            <input type="text" id="tueste" class="w-full rounded border-outline/30 focus:border-primary focus:ring-primary bg-white" placeholder="Ej. Medio, Claro..." required />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Precio ($)</label>
              <input type="number" step="0.01" id="precio" class="w-full rounded border-outline/30 focus:border-primary focus:ring-primary bg-white" placeholder="0.00" required />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Stock (Gramos)</label>
              <input type="number" id="gramos" class="w-full rounded border-outline/30 focus:border-primary focus:ring-primary bg-white" placeholder="1000" required />
            </div>
          </div>
          
          <div class="pt-4 flex gap-3">
            <button type="submit" id="btn-submit" class="flex-grow bg-primary text-on-primary py-3 rounded font-semibold tracking-wide hover:bg-primary-container transition-colors shadow-sm">
              Guardar en Inventario
            </button>
            <button type="button" id="btn-cancelar" onclick="resetForm()" class="hidden bg-surface-container-highest text-primary px-4 rounded font-semibold border border-outline/20 hover:bg-outline/10 transition-colors">
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="lg:col-span-2">
      <div class="bg-white rounded-xl shadow-sm border border-outline/10 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-highest border-b border-outline/20">
                <th class="py-4 px-6 text-xs font-semibold text-primary uppercase tracking-wider">ID</th>
                <th class="py-4 px-6 text-xs font-semibold text-primary uppercase tracking-wider">Origen / Variedad</th>
                <th class="py-4 px-6 text-xs font-semibold text-primary uppercase tracking-wider">Tueste</th>
                <th class="py-4 px-6 text-xs font-semibold text-primary uppercase tracking-wider text-right">Precio</th>
                <th class="py-4 px-6 text-xs font-semibold text-primary uppercase tracking-wider text-right">Stock (g)</th>
                <th class="py-4 px-6 text-xs font-semibold text-primary uppercase tracking-wider text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-inventario" class="divide-y divide-outline/10 text-sm">
              </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    const API = 'http://127.0.0.1:8080';

    // Manejo del Formulario (Crear o Actualizar)
    document.getElementById('form-inventario').addEventListener('submit', async e => {
      e.preventDefault();
      
      const idInput = document.getElementById('cafe-id').value;
      const data = {
        nombre: document.getElementById('nombre').value,
        variedad: document.getElementById('variedad').value,
        tueste: document.getElementById('tueste').value,
        precio: parseFloat(document.getElementById('precio').value),
        gramos: parseInt(document.getElementById('gramos').value)
      };

      try {
        let resp;
        if (idInput === "") {
            // Es un registro nuevo (POST)
            resp = await fetch(`${API}/cafe`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } else {
            // Es una actualización (PUT)
            resp = await fetch(`${API}/cafe/${idInput}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        if (resp.ok) {
          resetForm();
          listarInventario();
        } else {
          alert('Error al guardar en el servidor.');
        }
      } catch(err) {
        console.error("Error:", err);
      }
    });

    // Listar Datos en la Tabla
    async function listarInventario() {
      try {
        const resp = await fetch(`${API}/cafes`);
        const lista = await resp.json();
        const tbody = document.getElementById('tbody-inventario');
        tbody.innerHTML = '';
        
        if(lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-on-surface-variant">El inventario está vacío. Registra un nuevo café.</td></tr>`;
            return;
        }

        lista.forEach(c => {
          // Si el stock baja de 500g, lo pintamos de rojo como alerta
          const stockColor = c.gramos < 500 ? 'text-error font-bold' : 'text-on-surface-variant';

          const tr = document.createElement('tr');
          tr.className = "table-row-hover transition-colors";
          tr.innerHTML = `
            <td class="py-4 px-6 text-outline font-mono">${c.id}</td>
            <td class="py-4 px-6">
                <div class="font-serif text-primary font-bold text-base">${c.nombre}</div>
                <div class="text-xs text-on-surface-variant uppercase tracking-wide mt-1">${c.variedad}</div>
            </td>
            <td class="py-4 px-6 text-on-surface-variant">${c.tueste}</td>
            <td class="py-4 px-6 text-right font-serif text-primary font-bold">$${c.precio.toFixed(2)}</td>
            <td class="py-4 px-6 text-right ${stockColor}">${c.gramos}g</td>
            <td class="py-4 px-6 text-center">
              <div class="flex justify-center gap-2">
                  <button onclick="prepararEdicion(${c.id})" class="text-primary hover:text-on-surface-variant transition-colors p-1" title="Editar">
                    <span class="material-symbols-outlined text-xl">edit</span>
                  </button>
                  <button onclick="eliminar(${c.id})" class="text-error hover:text-red-700 transition-colors p-1" title="Eliminar">
                    <span class="material-symbols-outlined text-xl">delete</span>
                  </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch(err) {
        console.error("Error cargando inventario:", err);
      }
    }

    // Preparar el formulario para Editar (Reemplaza al prompt feo)
    window.prepararEdicion = async id => {
      try {
        const respGet = await fetch(`${API}/cafe/${id}`);
        if (!respGet.ok) return alert('No se pudo obtener datos del servidor');
        
        const c = await respGet.json();
        
        // Subimos los datos al formulario
        document.getElementById('cafe-id').value = c.id;
        document.getElementById('nombre').value = c.nombre;
        document.getElementById('variedad').value = c.variedad;
        document.getElementById('tueste').value = c.tueste;
        document.getElementById('precio').value = c.precio;
        document.getElementById('gramos').value = c.gramos;

        // Cambiamos la apariencia del formulario
        document.getElementById('form-titulo').textContent = "Editar Registro #" + c.id;
        document.getElementById('form-icon').textContent = "edit_document";
        document.getElementById('btn-submit').textContent = "Actualizar Cambios";
        document.getElementById('btn-cancelar').classList.remove("hidden");
        
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Sube la pantalla al form
      } catch(err) {
        console.error("Error al preparar edición:", err);
      }
    };

    // Restaurar el formulario a modo Creación
    window.resetForm = () => {
        document.getElementById('form-inventario').reset();
        document.getElementById('cafe-id').value = "";
        document.getElementById('form-titulo').textContent = "Registrar Café";
        document.getElementById('form-icon').textContent = "add_circle";
        document.getElementById('btn-submit').textContent = "Guardar en Inventario";
        document.getElementById('btn-cancelar').classList.add("hidden");
    };

    // Eliminar
    window.eliminar = async id => {
      if (!confirm('¿Estás seguro de eliminar este registro del inventario?')) return;
      try {
        const resp = await fetch(`${API}/cafe/${id}`, { method: 'DELETE' });
        if (resp.ok) {
          listarInventario();
        } else {
          alert('Error al eliminar en la base de datos.');
        }
      } catch(err) {
        console.error("Error al eliminar:", err);
      }
    };

    // Cargar la lista automáticamente al abrir la página
    listarInventario();
  </script>
</body>
</html>
